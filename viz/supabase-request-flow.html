<style>
  :root{
    --bg:#FBFAF6; --panel:#FFFFFF; --panel2:#F4F1E8;
    --ink:#26262B; --muted:#6E6A5E; --line:#D9D4C6;
    --accent:#1971C2; --amber:#E8590C; --green:#2B8A3E;
    --violet:#6741D9; --teal:#0C8599; --pink:#C2255C; --red:#E03131;
    --hand:'Segoe Print','Bradley Hand','Comic Sans MS','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    --ui:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#191A1E; --panel:#232429; --panel2:#2A2B31;
      --ink:#ECEAE2; --muted:#9C988C; --line:#3B3C44;
      --accent:#4DABF7; --amber:#FFA94D; --green:#69DB7C;
      --violet:#B197FC; --teal:#3BC9DB; --pink:#F783AC; --red:#FF8787;
    }
  }
  :root[data-theme="dark"]{
    --bg:#191A1E; --panel:#232429; --panel2:#2A2B31;
    --ink:#ECEAE2; --muted:#9C988C; --line:#3B3C44;
    --accent:#4DABF7; --amber:#FFA94D; --green:#69DB7C;
    --violet:#B197FC; --teal:#3BC9DB; --pink:#F783AC; --red:#FF8787;
  }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .wrap{background:var(--bg);color:var(--ink);font-family:var(--ui);padding:20px;border-radius:14px;line-height:1.6}
  .head h1{font-family:var(--hand);font-size:26px;font-weight:400;margin:0 0 2px;letter-spacing:.3px}
  .head p{margin:0 0 14px;color:var(--muted);font-size:14px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .reqs{display:flex;flex-wrap:wrap;gap:8px}
  .req{font-family:var(--hand);font-size:15px;background:var(--panel);color:var(--ink);border:2px solid var(--line);
    border-radius:12px;padding:7px 13px;cursor:pointer;transition:transform .08s,border-color .15s,background .15s}
  .req:hover{transform:translateY(-1px)}
  .req[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2)}
  .req:focus-visible,#send:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  #send{font-family:var(--hand);font-size:16px;margin-left:auto;background:var(--accent);color:#fff;border:2px solid var(--accent);
    border-radius:12px;padding:8px 18px;cursor:pointer;box-shadow:2px 3px 0 rgba(0,0,0,.18)}
  #send:hover{filter:brightness(1.05)}
  #send:active{transform:translate(1px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.18)}
  #send[disabled]{opacity:.5;cursor:default;box-shadow:none}
  .stage{overflow-x:auto;border:2px dashed var(--line);border-radius:14px;background:var(--panel2);padding:6px}
  svg{display:block;width:100%;min-width:640px;height:auto}
  .bx{fill:var(--panel);stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
  .bx.kong{stroke:var(--accent)} .bx.s0{stroke:var(--teal)} .bx.s1{stroke:var(--violet)}
  .bx.s2{stroke:var(--amber)} .bx.s3{stroke:var(--pink)} .bx.s4{stroke:var(--green)} .bx.pg{stroke:var(--ink);stroke-width:3}
  .svc{opacity:.4;transition:opacity .25s}
  .svc.on{opacity:1}
  .road{stroke:var(--line);stroke-width:2.4;fill:none;stroke-linecap:round}
  .road.on{stroke:var(--accent);stroke-width:3.4}
  .lbl{font-family:var(--hand);fill:var(--ink);text-anchor:middle}
  .lbl.big{font-size:17px} .lbl.sm{font-size:12.5px;fill:var(--muted)}
  .badge{font-family:var(--hand);font-size:12px;text-anchor:middle}
  #rls{opacity:0;transition:opacity .2s}
  #rls.show{opacity:1}
  .steps{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px}
  .steps li{display:flex;gap:10px;align-items:baseline;font-size:14.5px;color:var(--muted);
    border-left:3px solid var(--line);padding:4px 0 4px 12px;transition:color .2s,border-color .2s}
  .steps li .n{font-family:var(--hand);font-weight:400;color:var(--muted);min-width:18px}
  .steps li.active{color:var(--ink);border-color:var(--accent)}
  .steps li.active .n{color:var(--accent)}
  .steps li.done{color:var(--ink);border-color:var(--green)}
  .hint{margin-top:10px;font-size:12.5px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){.req,#send{transition:none}}
</style>

<h2 class="sr-only">Supabase 아키텍처를 통과하는 클라이언트 요청 흐름을 보여주는 인터랙티브 다이어그램. 요청 종류를 고르고 보내기를 누르면 패킷이 클라이언트에서 API 게이트웨이, 해당 서비스, PostgreSQL을 거쳐 응답으로 돌아옵니다.</h2>

<div class="wrap">
  <div class="head">
    <h1>Supabase 요청 흐름</h1>
    <p>요청 종류를 고르고 <b>요청 보내기</b>를 누르면, 패킷이 아키텍처를 따라 흐릅니다.</p>
  </div>

  <div class="controls">
    <div class="reqs" role="group" aria-label="요청 종류">
      <button class="req" data-type="db" aria-pressed="true">DB 조회</button>
      <button class="req" data-type="auth" aria-pressed="false">로그인</button>
      <button class="req" data-type="realtime" aria-pressed="false">실시간 구독</button>
      <button class="req" data-type="storage" aria-pressed="false">파일 업로드</button>
      <button class="req" data-type="edge" aria-pressed="false">Edge 함수</button>
    </div>
    <button id="send">▶ 요청 보내기</button>
  </div>

  <div class="stage">
    <svg viewBox="0 0 900 560" role="img" aria-label="Supabase 아키텍처 다이어그램">
      <defs>
        <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>
        <marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
          <path d="M1,1 L7,5 L1,9" fill="none" stroke="var(--line)" stroke-width="1.6" stroke-linecap="round"/></marker>
      </defs>

      <g filter="url(#rough)">
        <path class="road" id="r-ck" d="M450,90 L450,120"/>
        <path class="road" id="r-k0" d="M410,180 L150,250"/>
        <path class="road" id="r-k1" d="M425,180 L300,250"/>
        <path class="road" id="r-k2" d="M450,182 L450,250"/>
        <path class="road" id="r-k3" d="M475,180 L600,250"/>
        <path class="road" id="r-k4" d="M490,180 L750,250"/>
        <path class="road" id="r-p0" d="M120,330 L150,430"/>
        <path class="road" id="r-p1" d="M285,330 L300,430"/>
        <path class="road" id="r-p2" d="M450,330 L450,430"/>
        <path class="road" id="r-p3" d="M615,330 L600,430"/>
        <path class="road" id="r-p4" d="M780,330 L750,430"/>

        <rect class="bx" x="340" y="30" width="220" height="60" rx="10"/>
        <rect class="bx kong" x="320" y="120" width="260" height="60" rx="10"/>
        <g class="svc on" id="svc0"><rect class="bx s0" x="45"  y="250" width="150" height="80" rx="10"/></g>
        <g class="svc" id="svc1"><rect class="bx s1" x="210" y="250" width="150" height="80" rx="10"/></g>
        <g class="svc" id="svc2"><rect class="bx s2" x="375" y="250" width="150" height="80" rx="10"/></g>
        <g class="svc" id="svc3"><rect class="bx s3" x="540" y="250" width="150" height="80" rx="10"/></g>
        <g class="svc" id="svc4"><rect class="bx s4" x="705" y="250" width="150" height="80" rx="10"/></g>
        <rect class="bx pg" x="45" y="430" width="810" height="80" rx="12"/>
      </g>

      <text class="lbl big" x="450" y="56">클라이언트 앱</text>
      <text class="lbl sm"  x="450" y="76">supabase-js (웹/모바일)</text>
      <text class="lbl big" x="450" y="146">API Gateway (Kong)</text>
      <text class="lbl sm"  x="450" y="166">단일 진입점 · 라우팅</text>

      <text class="lbl big" x="120" y="284">PostgREST</text><text class="lbl sm" x="120" y="304">REST API 자동생성</text>
      <text class="lbl big" x="285" y="284">Auth</text><text class="lbl sm" x="285" y="304">GoTrue · JWT</text>
      <text class="lbl big" x="450" y="284">Realtime</text><text class="lbl sm" x="450" y="304">WebSocket</text>
      <text class="lbl big" x="615" y="284">Storage</text><text class="lbl sm" x="615" y="304">파일 · S3</text>
      <text class="lbl big" x="780" y="284">Edge Fn</text><text class="lbl sm" x="780" y="304">Deno</text>

      <text class="lbl big" x="450" y="465">PostgreSQL</text>
      <text class="lbl sm"  x="450" y="486">모든 데이터의 원천 · single source of truth</text>
      <g id="rls"><rect x="690" y="444" width="150" height="30" rx="8" fill="none" stroke="var(--green)" stroke-width="2"/>
        <text class="badge" x="765" y="464" fill="var(--green)">RLS 검사 통과 ✓</text></g>

      <circle id="packet" cx="450" cy="60" r="9" fill="var(--amber)" stroke="#fff" stroke-width="1.5" opacity="0"/>
    </svg>
  </div>

  <ol class="steps" id="steps"></ol>
  <p class="hint">💡 SQL Editor(대시보드)로 접속할 땐 이 API 경로를 거치지 않고 DB에 직접(관리자 권한, RLS 우회) 붙습니다.</p>
</div>

<script>
(function(){
  var svcCx=[120,285,450,615,780];
  var FLOWS={
    db:{svc:0,steps:["supabase-js가 select 요청 생성 (anon key 첨부)","Kong 게이트웨이 도착 → 키/인증 확인","PostgREST로 라우팅","PostgreSQL에서 RLS 검사 (이 유저가 이 행을 봐도 되나?)","허용된 행만 JSON으로 반환 ↩"]},
    auth:{svc:1,steps:["supabase-js가 signInWithPassword 호출","Kong 게이트웨이 도착","Auth(GoTrue)로 라우팅","auth.users에서 검증 → JWT 토큰 발급","세션 토큰을 클라이언트로 반환 ↩"]},
    realtime:{svc:2,steps:["supabase-js가 채널 구독 (WebSocket)","Kong 게이트웨이 도착","Realtime 서버와 연결 수립","Postgres WAL(변경 로그)을 실시간 감시","변경이 생기면 즉시 push ↩ (연결 유지)"]},
    storage:{svc:3,steps:["supabase-js가 upload()로 파일 전송","Kong 게이트웨이 도착","Storage API로 라우팅","버킷 RLS 정책 검사 + S3에 저장","파일 URL을 반환 ↩"]},
    edge:{svc:4,steps:["supabase-js가 functions.invoke() 호출","Kong 게이트웨이 도착","Edge Function(Deno) 실행","필요 시 PostgreSQL 접근","실행 결과를 반환 ↩"]}
  };
  var type="db";
  var packet=document.getElementById("packet");
  var stepsEl=document.getElementById("steps");
  var sendBtn=document.getElementById("send");
  var rls=document.getElementById("rls");
  var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var running=false;

  function highlightSvc(i){
    for(var k=0;k<5;k++){document.getElementById("svc"+k).classList.toggle("on",k===i);}
    ["r-k0","r-k1","r-k2","r-k3","r-k4"].forEach(function(id,k){document.getElementById(id).classList.toggle("on",k===i);});
    ["r-p0","r-p1","r-p2","r-p3","r-p4"].forEach(function(id,k){document.getElementById(id).classList.toggle("on",k===i);});
    document.getElementById("r-ck").classList.add("on");
  }
  function renderSteps(){
    var s=FLOWS[type].steps;stepsEl.innerHTML="";
    for(var i=0;i<s.length;i++){
      var li=document.createElement("li");
      li.innerHTML='<span class="n">'+(i+1)+'</span><span>'+s[i]+'</span>';
      stepsEl.appendChild(li);
    }
  }
  function setActive(i){
    var lis=stepsEl.children;
    for(var k=0;k<lis.length;k++){lis[k].classList.toggle("active",k===i);lis[k].classList.toggle("done",k<i);}
  }
  function select(t){
    type=t;
    document.querySelectorAll(".req").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.type===t?"true":"false");});
    highlightSvc(FLOWS[t].svc);renderSteps();rls.classList.remove("show");
    packet.setAttribute("opacity","0");
  }
  document.querySelectorAll(".req").forEach(function(b){b.addEventListener("click",function(){if(!running)select(b.dataset.type);});});

  function move(x,y){packet.setAttribute("cx",x);packet.setAttribute("cy",y);}
  function tween(x0,y0,x1,y1,dur){
    return new Promise(function(res){
      if(reduce||dur<=0){move(x1,y1);setTimeout(res,220);return;}
      var t0=null;
      function frame(ts){
        if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/dur);var e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
        move(x0+(x1-x0)*e,y0+(y1-y0)*e);
        if(p<1)requestAnimationFrame(frame);else res();
      }
      requestAnimationFrame(frame);
    });
  }
  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}

  async function run(){
    if(running)return;running=true;sendBtn.disabled=true;
    var cx=svcCx[FLOWS[type].svc];
    rls.classList.remove("show");
    packet.setAttribute("fill","var(--amber)");packet.setAttribute("opacity","1");
    move(450,60);setActive(0);await wait(reduce?300:650);
    await tween(450,60,450,150,600);setActive(1);await wait(reduce?250:450);
    await tween(450,150,cx,290,650);setActive(2);await wait(reduce?250:450);
    await tween(cx,290,cx,445,600);setActive(3);
    if(FLOWS[type].svc!==2){rls.classList.add("show");}
    await wait(reduce?350:750);
    packet.setAttribute("fill","var(--green)");
    await tween(cx,445,cx,290,500);
    await tween(cx,290,450,150,500);
    await tween(450,150,450,60,500);setActive(4);
    var lis=stepsEl.children;lis[4].classList.add("done");lis[4].classList.remove("active");
    await wait(400);
    running=false;sendBtn.disabled=false;
  }
  sendBtn.addEventListener("click",run);

  select("db");
})();
</script>
