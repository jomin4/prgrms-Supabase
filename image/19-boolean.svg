<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="678" height="398" rx="14" fill="#FCFBF8" stroke="#E5E3DC"/>
  <text x="40" y="38" font-size="17" font-weight="600" fill="#2C2C2A">19강 · boolean 타입</text>

  <rect x="250" y="56" width="180" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="340" y="80" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">boolean</text>
  <text x="340" y="98" font-size="12" fill="#0F6E56" text-anchor="middle">참(true) / 거짓(false)</text>

  <line x1="320" y1="106" x2="215" y2="128" stroke="#888780" stroke-width="2"/>
  <path d="M209,122 L207,132 L217,129 Z" fill="#888780"/>
  <line x1="360" y1="106" x2="465" y2="128" stroke="#888780" stroke-width="2"/>
  <path d="M471,122 L473,132 L463,129 Z" fill="#888780"/>

  <rect x="60" y="132" width="250" height="136" rx="8" fill="#EAF3DE" stroke="#639922"/>
  <text x="185" y="158" font-size="14" font-weight="500" fill="#173404" text-anchor="middle">true (참)</text>
  <text x="185" y="184" font-size="12" fill="#3B6D11" text-anchor="middle">true</text>
  <text x="185" y="206" font-size="12" fill="#3B6D11" text-anchor="middle">'t' · 'yes' · 'y'</text>
  <text x="185" y="228" font-size="12" fill="#3B6D11" text-anchor="middle">'1' (문자열)</text>
  <text x="185" y="250" font-size="12" fill="#3B6D11" text-anchor="middle">1::boolean (캐스트)</text>

  <rect x="370" y="132" width="250" height="136" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="495" y="158" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">false (거짓)</text>
  <text x="495" y="184" font-size="12" fill="#854F0B" text-anchor="middle">false</text>
  <text x="495" y="206" font-size="12" fill="#854F0B" text-anchor="middle">'f' · 'no' · 'n'</text>
  <text x="495" y="228" font-size="12" fill="#854F0B" text-anchor="middle">'0' (문자열)</text>
  <text x="495" y="250" font-size="12" fill="#854F0B" text-anchor="middle">0::boolean (캐스트)</text>

  <rect x="60" y="282" width="560" height="44" rx="8" fill="#FCEBEB" stroke="#F09595"/>
  <text x="340" y="309" font-size="13" fill="#791F1F" text-anchor="middle">맨숫자 1 / 0 은 자동 변환 안 됨 → 문자열 '1' 또는 1::boolean 로 써야 함</text>

  <rect x="60" y="336" width="560" height="46" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="340" y="356" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">null = 아직 정해지지 않음 (제3의 상태, false와 다름)</text>
  <text x="340" y="374" font-size="12" fill="#185FA5" text-anchor="middle">실무: is_active, is_public 같은 on/off 플래그에 사용</text>
</svg>
