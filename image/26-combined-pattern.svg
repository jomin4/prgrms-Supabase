<svg xmlns="http://www.w3.org/2000/svg" width="680" height="384" viewBox="0 0 680 384" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="678" height="382" rx="14" fill="#FCFBF8" stroke="#E5E3DC"/>
  <text x="40" y="38" font-size="17" font-weight="600" fill="#2C2C2A">26강 · 여러 컬럼 제약조건 + 기본값 패턴</text>

  <rect x="40" y="54" width="600" height="30" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="54" y="74" font-size="13" font-weight="500" fill="#2C2C2A">컬럼</text>
  <text x="180" y="74" font-size="13" font-weight="500" fill="#2C2C2A">타입</text>
  <text x="316" y="74" font-size="13" font-weight="500" fill="#2C2C2A">제약조건</text>

  <text x="54" y="109" font-size="14" fill="#2C2C2A">id</text><text x="180" y="109" font-size="14" fill="#2C2C2A">bigint</text>
  <rect x="316" y="92" width="96" height="24" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="364" y="109" font-size="12" fill="#085041" text-anchor="middle">primary key</text>

  <text x="54" y="147" font-size="14" fill="#2C2C2A">email</text><text x="180" y="147" font-size="14" fill="#2C2C2A">text</text>
  <rect x="316" y="130" width="74" height="24" rx="6" fill="#FAECE7" stroke="#993C1D"/><text x="353" y="147" font-size="12" fill="#712B13" text-anchor="middle">not null</text>
  <rect x="398" y="130" width="64" height="24" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="430" y="147" font-size="12" fill="#633806" text-anchor="middle">unique</text>

  <text x="54" y="185" font-size="14" fill="#2C2C2A">name</text><text x="180" y="185" font-size="14" fill="#2C2C2A">text</text>
  <rect x="316" y="168" width="74" height="24" rx="6" fill="#FAECE7" stroke="#993C1D"/><text x="353" y="185" font-size="12" fill="#712B13" text-anchor="middle">not null</text>

  <text x="54" y="223" font-size="14" fill="#2C2C2A">age</text><text x="180" y="223" font-size="14" fill="#2C2C2A">integer</text>
  <text x="316" y="223" font-size="12" fill="#888780">— (제약 없음)</text>

  <text x="54" y="261" font-size="14" fill="#2C2C2A">is_active</text><text x="180" y="261" font-size="14" fill="#2C2C2A">boolean</text>
  <rect x="316" y="244" width="74" height="24" rx="6" fill="#FAECE7" stroke="#993C1D"/><text x="353" y="261" font-size="12" fill="#712B13" text-anchor="middle">not null</text>
  <rect x="398" y="244" width="104" height="24" rx="6" fill="#E6F1FB" stroke="#378ADD"/><text x="450" y="261" font-size="12" fill="#0C447C" text-anchor="middle">default true</text>

  <text x="54" y="299" font-size="14" fill="#2C2C2A">created_at</text><text x="180" y="299" font-size="14" fill="#2C2C2A">timestamptz</text>
  <rect x="316" y="282" width="74" height="24" rx="6" fill="#FAECE7" stroke="#993C1D"/><text x="353" y="299" font-size="12" fill="#712B13" text-anchor="middle">not null</text>
  <rect x="398" y="282" width="110" height="24" rx="6" fill="#E6F1FB" stroke="#378ADD"/><text x="453" y="299" font-size="12" fill="#0C447C" text-anchor="middle">default now()</text>

  <rect x="40" y="330" width="600" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="340" y="352" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle">한 컬럼의 제약조건들은 공백으로 나열, 컬럼 사이만 콤마</text>
  <text x="340" y="370" font-size="12" fill="#534AB7" text-anchor="middle">예: email text not null unique,</text>
</svg>
