<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="678" height="318" rx="14" fill="#FCFBF8" stroke="#E5E3DC"/>
  <text x="40" y="38" font-size="17" font-weight="600" fill="#2C2C2A">25강 · default / default now()</text>

  <rect x="170" y="58" width="340" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="340" y="82" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle">created_at timestamptz default now()</text>
  <text x="340" y="100" font-size="12" fill="#534AB7" text-anchor="middle">안 넣으면 현재 시각 자동</text>

  <line x1="320" y1="110" x2="217" y2="132" stroke="#888780" stroke-width="2"/>
  <path d="M211,126 L209,136 L219,133 Z" fill="#888780"/>
  <line x1="360" y1="110" x2="463" y2="132" stroke="#888780" stroke-width="2"/>
  <path d="M469,126 L471,136 L461,133 Z" fill="#888780"/>

  <rect x="60" y="134" width="250" height="74" rx="8" fill="#EAF3DE" stroke="#639922"/>
  <text x="185" y="160" font-size="14" font-weight="500" fill="#173404" text-anchor="middle">값 생략</text>
  <text x="185" y="182" font-size="12" fill="#3B6D11" text-anchor="middle">→ now() 가 자동으로 채움</text>
  <text x="185" y="202" font-size="12" fill="#3B6D11" text-anchor="middle">예: 2026-08-18 08:20+00</text>

  <rect x="370" y="134" width="250" height="74" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="495" y="160" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">값 지정: '2020-01-01'</text>
  <text x="495" y="182" font-size="12" fill="#185FA5" text-anchor="middle">→ 지정한 값 그대로 저장</text>

  <rect x="60" y="224" width="560" height="76" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="340" y="248" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">default = insert에서 컬럼을 생략했을 때만 작동</text>
  <text x="340" y="270" font-size="12" fill="#854F0B" text-anchor="middle">명시적으로 null 을 넣으면 null 로 들어감 (not null이면 에러)</text>
  <text x="340" y="290" font-size="12" fill="#854F0B" text-anchor="middle">흔한 패턴: default now() · default true · default 0 · default gen_random_uuid()</text>
</svg>
