<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="678" height="398" rx="14" fill="#FCFBF8" stroke="#E5E3DC"/>
  <text x="40" y="38" font-size="17" font-weight="600" fill="#2C2C2A">18강 · 날짜/시간 타입 (timestamp vs timestamptz)</text>

  <rect x="240" y="62" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="340" y="89" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">서울 14:30 입력</text>

  <line x1="330" y1="106" x2="190" y2="140" stroke="#888780" stroke-width="2"/>
  <path d="M184,134 L182,144 L192,141 Z" fill="#888780"/>
  <line x1="350" y1="106" x2="490" y2="140" stroke="#888780" stroke-width="2"/>
  <path d="M496,134 L498,144 L488,141 Z" fill="#888780"/>

  <rect x="60" y="146" width="250" height="54" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="185" y="170" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">timestamp</text>
  <text x="185" y="189" font-size="12" fill="#854F0B" text-anchor="middle">시간대 정보 없음</text>
  <rect x="60" y="210" width="250" height="88" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="78" y="236" font-size="12" fill="#854F0B">저장값: 2026-08-18 14:30</text>
  <text x="78" y="260" font-size="12" fill="#854F0B">시간대 꼬리표가 없음</text>
  <text x="78" y="284" font-size="12" fill="#854F0B">→ 어느 지역 시각인지 모름</text>

  <rect x="370" y="146" width="250" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="495" y="170" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">timestamptz</text>
  <text x="495" y="189" font-size="12" fill="#0F6E56" text-anchor="middle">시간대 기준으로 저장 (UTC)</text>
  <rect x="370" y="210" width="250" height="88" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="388" y="236" font-size="12" fill="#0F6E56">저장(UTC): ...05:30+00</text>
  <text x="388" y="260" font-size="12" fill="#0F6E56">항상 같은 절대 순간</text>
  <text x="388" y="284" font-size="12" fill="#0F6E56">→ 어디서 봐도 안 헷갈림</text>

  <rect x="60" y="312" width="560" height="52" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="340" y="336" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">실무 · Supabase 는 거의 항상 timestamptz 를 쓴다</text>
  <text x="340" y="356" font-size="12" fill="#185FA5" text-anchor="middle">now() 도 timestamptz 를 반환 · tstz 값에만 +00 오프셋이 붙는다</text>
</svg>
