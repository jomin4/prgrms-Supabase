<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="678" height="398" rx="14" fill="#FCFBF8" stroke="#E5E3DC"/>
  <text x="40" y="30" font-size="16" font-weight="600" fill="#2C2C2A">6·7강 · 카카오 소셜 로그인 (OAuth) 흐름</text>
  <defs>
    <marker id="rt" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/></marker>
    <marker id="lt" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M7,1 L1,4 L7,7" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/></marker>
  </defs>

  <rect x="40" y="48" width="180" height="42" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/><text x="130" y="74" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">클라이언트 앱</text>
  <rect x="250" y="48" width="180" height="42" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="340" y="74" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">Supabase</text>
  <rect x="460" y="48" width="180" height="42" rx="8" fill="#FAEEDA" stroke="#854F0B"/><text x="550" y="74" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">카카오</text>

  <line x1="130" y1="90" x2="130" y2="366" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="340" y1="90" x2="340" y2="366" stroke="#5DCAA5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="550" y1="90" x2="550" y2="366" stroke="#EF9F27" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="235" y="114" font-size="12" fill="#6E6A5E" text-anchor="middle">① signInWithOAuth('kakao')</text>
  <line x1="130" y1="122" x2="340" y2="122" stroke="#888780" stroke-width="1.8" marker-end="url(#rt)"/>

  <text x="445" y="146" font-size="12" fill="#6E6A5E" text-anchor="middle">② 카카오 로그인 페이지로 이동</text>
  <line x1="340" y1="154" x2="550" y2="154" stroke="#888780" stroke-width="1.8" marker-end="url(#rt)"/>

  <rect x="470" y="170" width="160" height="30" rx="7" fill="#FAEEDA" stroke="#854F0B"/><text x="550" y="189" font-size="12" fill="#633806" text-anchor="middle">사용자: 로그인 + 동의</text>

  <text x="445" y="222" font-size="12" fill="#6E6A5E" text-anchor="middle">③ authorization code (콜백)</text>
  <line x1="550" y1="230" x2="340" y2="230" stroke="#888780" stroke-width="1.8" marker-end="url(#lt)"/>

  <text x="445" y="254" font-size="12" fill="#6E6A5E" text-anchor="middle">④ code ↔ token 교환 · 유저정보</text>
  <line x1="340" y1="262" x2="550" y2="262" stroke="#888780" stroke-width="1.8" marker-end="url(#rt)"/>

  <text x="235" y="302" font-size="12" fill="#6E6A5E" text-anchor="middle">⑤ auth.users 생성 + JWT 세션</text>
  <line x1="340" y1="310" x2="130" y2="310" stroke="#888780" stroke-width="1.8" marker-end="url(#lt)"/>

  <rect x="40" y="334" width="600" height="40" rx="8" fill="#EAF3DE" stroke="#639922"/><text x="340" y="358" font-size="13" font-weight="500" fill="#173404" text-anchor="middle">→ 앱으로 돌아와 로그인 완료 (이메일 로그인과 똑같은 JWT 세션)</text>
</svg>
