<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="678" height="298" rx="14" fill="#FCFBF8" stroke="#E5E3DC"/>
  <text x="40" y="38" font-size="17" font-weight="600" fill="#2C2C2A">14강 · 실습용 table 초기화 패턴</text>

  <rect x="40" y="58" width="330" height="170" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="60" y="90" font-size="14" fill="#A32D2D">drop table if exists members;</text>
  <text x="60" y="128" font-size="14" fill="#2C2C2A">create table members (</text>
  <text x="84" y="152" font-size="14" fill="#2C2C2A">email text,</text>
  <text x="84" y="176" font-size="14" fill="#2C2C2A">name text</text>
  <text x="60" y="200" font-size="14" fill="#2C2C2A">);</text>

  <rect x="398" y="66" width="242" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="414" y="93" font-size="13" fill="#633806">① 있던 members 있으면 삭제</text>
  <rect x="398" y="118" width="242" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="414" y="145" font-size="13" fill="#085041">② members 새로 깨끗하게 생성</text>
  <rect x="398" y="170" width="242" height="58" rx="8" fill="#EAF3DE" stroke="#97C459"/>
  <text x="519" y="194" font-size="13" font-weight="500" fill="#173404" text-anchor="middle">몇 번 Run 해도</text>
  <text x="519" y="214" font-size="13" font-weight="500" fill="#173404" text-anchor="middle">항상 같은 결과 (재실행 안전)</text>

  <rect x="40" y="244" width="600" height="42" rx="8" fill="#EEEDFE" stroke="#AFA9EC"/>
  <text x="60" y="270" font-size="13" fill="#3C3489">drop if exists + create 를 세트로  →  실습하며 몇 번이든 초기화 가능한 정석 패턴</text>
</svg>
