<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="678" height="298" rx="14" fill="#FCFBF8" stroke="#E5E3DC"/>
  <text x="40" y="38" font-size="17" font-weight="600" fill="#2C2C2A">28강 · identity + primary key (bigint 패턴)</text>

  <rect x="70" y="56" width="540" height="42" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="340" y="82" font-size="14" fill="#2C2C2A" text-anchor="middle">id bigint generated always as identity primary key</text>

  <rect x="40" y="116" width="190" height="82" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="135" y="144" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">bigint</text>
  <text x="135" y="166" font-size="12" fill="#185FA5" text-anchor="middle">큰 정수 타입</text>
  <text x="135" y="186" font-size="12" fill="#185FA5" text-anchor="middle">(17강)</text>

  <rect x="245" y="116" width="190" height="82" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="340" y="144" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle">generated ... identity</text>
  <text x="340" y="166" font-size="12" fill="#534AB7" text-anchor="middle">자동 1, 2, 3 증가</text>
  <text x="340" y="186" font-size="12" fill="#534AB7" text-anchor="middle">(27강)</text>

  <rect x="450" y="116" width="190" height="82" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="545" y="144" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">primary key</text>
  <text x="545" y="166" font-size="12" fill="#0F6E56" text-anchor="middle">유일 + 필수 + 대표</text>
  <text x="545" y="186" font-size="12" fill="#0F6E56" text-anchor="middle">(24강)</text>

  <rect x="40" y="218" width="600" height="64" rx="8" fill="#EAF3DE" stroke="#639922"/>
  <text x="340" y="244" font-size="14" font-weight="500" fill="#173404" text-anchor="middle">insert 시 id 안 넣어도 자동으로 1, 2, 3 부여</text>
  <text x="340" y="266" font-size="12" fill="#3B6D11" text-anchor="middle">중복·null 불가 + 그 행의 대표 식별자 = 실무 id 컬럼 국룰</text>
</svg>
