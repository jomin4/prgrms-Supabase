<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="678" height="288" rx="14" fill="#FCFBF8" stroke="#E5E3DC"/>
  <text x="40" y="38" font-size="17" font-weight="600" fill="#2C2C2A">16강 · 문자열 타입 (text, varchar)</text>

  <rect x="40" y="58" width="190" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="135" y="90" font-size="15" font-weight="500" fill="#085041" text-anchor="middle">text</text>
  <text x="135" y="114" font-size="12" fill="#0F6E56" text-anchor="middle">길이 제한 없음</text>

  <rect x="245" y="58" width="190" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="340" y="90" font-size="15" font-weight="500" fill="#085041" text-anchor="middle">varchar</text>
  <text x="340" y="114" font-size="12" fill="#0F6E56" text-anchor="middle">제한 없음 · text와 사실상 동일</text>

  <rect x="450" y="58" width="190" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="545" y="90" font-size="15" font-weight="500" fill="#3C3489" text-anchor="middle">varchar(N)</text>
  <text x="545" y="114" font-size="12" fill="#534AB7" text-anchor="middle">최대 N자까지만</text>

  <rect x="40" y="150" width="600" height="52" rx="8" fill="#FCEBEB" stroke="#F09595"/>
  <text x="60" y="174" font-size="13" font-weight="500" fill="#501313">varchar(10) 컬럼에 'hello world!' (12자) 저장 시도</text>
  <text x="60" y="194" font-size="12" fill="#A32D2D">→ 에러: 정한 길이(10자)를 초과함 (value too long)</text>

  <rect x="40" y="214" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="60" y="238" font-size="13" fill="#2C2C2A">PostgreSQL에서 text 와 varchar 는 성능 차이가 거의 없다.</text>
  <text x="60" y="258" font-size="13" fill="#2C2C2A">길이 제한이 꼭 필요할 때만 varchar(N) 을 쓴다.</text>
</svg>
