<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="678" height="298" rx="14" fill="#FCFBF8" stroke="#E5E3DC"/>
  <text x="40" y="38" font-size="17" font-weight="600" fill="#2C2C2A">15강 · 타입이란?</text>

  <rect x="40" y="56" width="600" height="32" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="52" y="77" font-size="12" font-weight="500" fill="#2C2C2A">컬럼</text>
  <text x="182" y="77" font-size="12" font-weight="500" fill="#2C2C2A">타입</text>
  <text x="292" y="77" font-size="12" font-weight="500" fill="#2C2C2A">받는 값 (예)</text>
  <text x="482" y="77" font-size="12" font-weight="500" fill="#2C2C2A">거부하는 값</text>

  <rect x="40" y="88" width="600" height="44" fill="none" stroke="#D3D1C7"/>
  <text x="52" y="115" font-size="13" fill="#2C2C2A">email</text>
  <text x="182" y="115" font-size="13" fill="#085041">text</text>
  <text x="292" y="115" font-size="13" fill="#3B6D11">'abc@x.com'</text>
  <text x="482" y="115" font-size="12" fill="#888780">(문자는 대부분 허용)</text>

  <rect x="40" y="132" width="600" height="44" fill="none" stroke="#D3D1C7"/>
  <text x="52" y="159" font-size="13" fill="#2C2C2A">age</text>
  <text x="182" y="159" font-size="13" fill="#085041">integer</text>
  <text x="292" y="159" font-size="13" fill="#3B6D11">25</text>
  <text x="482" y="159" font-size="12" fill="#A32D2D">'스물다섯' (문자) → 에러</text>

  <rect x="40" y="176" width="600" height="44" fill="none" stroke="#D3D1C7"/>
  <text x="52" y="203" font-size="13" fill="#2C2C2A">is_active</text>
  <text x="182" y="203" font-size="13" fill="#085041">boolean</text>
  <text x="292" y="203" font-size="13" fill="#3B6D11">true / false</text>
  <text x="482" y="203" font-size="12" fill="#A32D2D">'maybe' → 에러</text>

  <rect x="40" y="232" width="600" height="44" rx="8" fill="#EEEDFE" stroke="#AFA9EC"/>
  <text x="60" y="260" font-size="13" fill="#3C3489">타입 = 그 칸에 담을 수 있는 값의 "종류"를 정하는 규칙. 어긋난 종류는 DB가 거부(에러).</text>
</svg>
