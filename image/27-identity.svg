<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="678" height="318" rx="14" fill="#FCFBF8" stroke="#E5E3DC"/>
  <text x="40" y="38" font-size="17" font-weight="600" fill="#2C2C2A">27강 · identity (generated always as identity)</text>

  <rect x="140" y="58" width="400" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="340" y="82" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle">id bigint generated always as identity</text>
  <text x="340" y="100" font-size="12" fill="#534AB7" text-anchor="middle">DB가 id를 자동 생성 (1, 2, 3 ...)</text>

  <line x1="320" y1="110" x2="217" y2="132" stroke="#888780" stroke-width="2"/>
  <path d="M211,126 L209,136 L219,133 Z" fill="#888780"/>
  <line x1="360" y1="110" x2="463" y2="132" stroke="#888780" stroke-width="2"/>
  <path d="M469,126 L471,136 L461,133 Z" fill="#888780"/>

  <rect x="60" y="134" width="250" height="66" rx="8" fill="#EAF3DE" stroke="#639922"/>
  <text x="185" y="161" font-size="14" font-weight="500" fill="#173404" text-anchor="middle">id 생략하고 insert</text>
  <text x="185" y="183" font-size="12" fill="#3B6D11" text-anchor="middle">→ 자동으로 1, 2, 3... 채움</text>

  <rect x="370" y="134" width="250" height="66" rx="8" fill="#FCEBEB" stroke="#E24B4A"/>
  <text x="495" y="161" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle">id = 100 직접 넣기</text>
  <text x="495" y="183" font-size="12" fill="#A32D2D" text-anchor="middle">→ 에러 (always는 직접 금지)</text>

  <rect x="60" y="214" width="560" height="32" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="340" y="235" font-size="12" fill="#5F5E5A" text-anchor="middle">cannot insert a non-DEFAULT value into column "id"</text>

  <rect x="60" y="256" width="560" height="48" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="340" y="278" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">generated ALWAYS = 직접 값 금지 (안전)</text>
  <text x="340" y="296" font-size="12" fill="#185FA5" text-anchor="middle">generated BY DEFAULT = 자동 + 직접 입력도 허용</text>
</svg>
